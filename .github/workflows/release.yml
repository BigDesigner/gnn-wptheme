name: Manual Release

on:
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Optional version confirmation; must exactly match the source version in gnn/style.css.'
        required: false
        default: ''

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  build-and-release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Resolve version
        id: version
        env:
          VERSION_INPUT: ${{ inputs.version_override }}
        run: |
          VERSION=$(python .scripts/check-release.py --version-override "$VERSION_INPUT")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build theme zip
        # Reuses the same packager used for local builds (.build/gnn.zip),
        # so CI releases and dev builds can never drift apart.
        run: python .scripts/build-zip.py

      - name: Name the release asset
        id: asset
        run: |
          mkdir -p dist
          ZIP_NAME="gnn-${{ steps.version.outputs.version }}.zip"
          cp .build/gnn.zip "dist/$ZIP_NAME"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          files: dist/${{ steps.asset.outputs.zip_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
