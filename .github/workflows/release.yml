name: Manual Release

on:
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Version override (optional, e.g. 1.0.1). If empty, the version is read from gnn/style.css. Note: this only affects the release tag/filename — bump gnn/style.css (and GNN_VERSION in gnn/functions.php) in a prior commit so the shipped theme matches.'
        required: false
        default: ''

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Resolve version
        id: version
        run: |
          VERSION_INPUT="${{ github.event.inputs.version_override }}"
          if [ -n "$VERSION_INPUT" ]; then
            VERSION="$VERSION_INPUT"
          else
            VERSION=$(grep -m 1 "^Version:" gnn/style.css | awk '{print $2}' | tr -d '\r')
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build theme zip
        # Reuses the same packager used for local builds (.build/gnn.zip),
        # so CI releases and dev builds can never drift apart.
        run: python .scripts/build-zip.py

      - name: Name the release asset
        id: asset
        run: |
          mkdir -p dist
          ZIP_NAME="gnn-${{ steps.version.outputs.version }}.zip"
          cp .build/gnn.zip "dist/$ZIP_NAME"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          files: dist/${{ steps.asset.outputs.zip_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
