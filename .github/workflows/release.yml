name: Manual Release

on:
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Optional version confirmation; must exactly match the source version in gnn/style.css.'
        required: false
        default: ''

jobs:
  # Tests are not repeated here: the push run of "Verify theme" must already be green.
  verify:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Require a green Verify run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/verify.yml/runs?head_sha=$GITHUB_SHA&event=push&status=success" --jq '.total_count')
          if [ "$count" -eq 0 ]; then
            echo "::error::Verify has not passed for $GITHUB_SHA. Wait for a green Verify run, then start the release again."
            exit 1
          fi
          echo "Verify passed for $GITHUB_SHA."
  build-and-release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: mbstring, xml
          coverage: none

      - name: Resolve version
        id: version
        env:
          VERSION_INPUT: ${{ inputs.version_override }}
        run: |
          VERSION=$(python .scripts/check-release.py --version-override "$VERSION_INPUT")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build theme zip
        # Reuses the same packager used for local builds (.build/gnn.zip),
        # so CI releases and dev builds can never drift apart.
        run: python .scripts/build-zip.py

      - name: Verify package contents
        # Rebuilds with the same packager, then checks ZIP integrity, exact file
        # lists and versions of every asset before anything is published.
        run: python .scripts/verify.py --package

      - name: Name the release asset
        id: asset
        run: |
          mkdir -p dist
          VERSION="${{ steps.version.outputs.version }}"
          cp ".build/gnn-$VERSION.zip" "dist/"
          cp ".build/gnn-child-$VERSION.zip" "dist/"
          cp ".build/gnn-content-$VERSION.zip" "dist/"
          cp ".build/gnn-$VERSION-manifest.json" "dist/"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          files: dist/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
