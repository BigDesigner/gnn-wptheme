name: Verify theme
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: mbstring, xml
          coverage: none
      - name: Verify static integrity and syntax
        run: python .scripts/verify.py

  wordpress-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install QA dependencies with pnpm
        run: |
          mkdir -p .temp/qa-tools
          pnpm --dir .temp/qa-tools add --ignore-scripts @wp-playground/cli@3.1.58 playwright@1.64.1 axe-core@4.11.0
      - name: Install Playwright Chromium
        run: pnpm --dir .temp/qa-tools exec playwright install --with-deps chromium
      - name: Run WordPress and browser integration tests
        run: node .scripts/test-wordpress.mjs
        env:
          GNN_QA_WP: '7.1.4'
